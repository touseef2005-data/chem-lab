<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemistry Lab Calculator</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2733;--mu:#5d6b79;--ac:#1f4e79;--bd:#d5dde6;--ok:#eaf3ea;--er:#fbeaea}
@media(prefers-color-scheme:dark){:root{--bg:#12181f;--card:#1b242d;--tx:#e6edf3;--mu:#98a6b3;--ac:#5aa0d8;--bd:#2f3b47;--ok:#1c2f22;--er:#3a2222}}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--ac);color:#fff;padding:16px;text-align:center}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{max-width:720px;margin:0 auto;padding:12px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav button{flex:1 1 auto;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
details{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
summary{padding:12px;font-weight:bold;cursor:pointer}
form{padding:0 12px 12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit}
textarea{min-height:64px}
.go{margin-top:12px;padding:10px 18px;background:var(--ac);color:#fff;border:0;border-radius:6px;font-size:15px;cursor:pointer}
.out{margin-top:10px;padding:10px;border-radius:6px;background:var(--ok);font-size:15px;line-height:1.6}
.out.err{background:var(--er)}
.out:empty{display:none}
.hi{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:8px;font-size:14px;line-height:1.5}.hi small{color:var(--mu)}.hb{display:flex;gap:8px;flex-wrap:wrap}

:root[data-theme=light]{--bg:#f4f7fb;--card:#fff;--tx:#1b2733;--mu:#5d6b79;--ac:#1f4e79;--bd:#d5dde6;--ok:#eaf3ea;--er:#fbeaea}
:root[data-theme=dark]{--bg:#12181f;--card:#1b242d;--tx:#e6edf3;--mu:#98a6b3;--ac:#5aa0d8;--bd:#2f3b47;--ok:#1c2f22;--er:#3a2222}
main{padding:12px 12px 84px}
#nav{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--card);border-top:1px solid var(--bd);z-index:9}
#nav button{border:0;border-radius:0;background:none;padding:8px 2px;font-size:11px;color:var(--mu)}
#nav button.on{color:var(--ac);font-weight:bold;background:none}
.sr{width:100%;padding:10px;margin:6px 0;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font-size:15px}
.bar{display:flex;align-items:center;gap:10px}.bar h2{margin:0;font-size:18px}
.bk{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:8px 10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;cursor:pointer;font-size:14px}
.tile span{font-size:24px}.tile small{color:var(--mu)}
.det{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14px}
.det h3{margin:4px 0}.det table{width:100%;border-collapse:collapse}.det td{padding:3px 0;border-top:1px solid var(--bd)}.det td:first-child{color:var(--mu);width:46%}
.ptw{overflow-x:auto;padding-bottom:6px}
.pt{display:grid;grid-template-columns:repeat(18,40px);grid-auto-rows:46px;gap:2px;width:max-content}
.el{color:#111;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;line-height:1.15}
.el small{font-size:9px}.ph{background:var(--bd);color:var(--mu);font-size:9px;cursor:default}
footer{text-align:center;color:var(--mu);font-size:12px;padding:14px}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e79">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<header><h1>Chemistry Lab Calculator</h1><p>Analytical chemistry formulas, tools and periodic table. Works offline.</p></header>
<main><nav id="nav"></nav><div id="box"></div></main>
<footer>Use consistent units (mL, g, mol/L). For lists, separate values with commas, spaces or new lines. Results are saved on this device only (History tab).</footer>
<script>
const sum=a=>a.reduce((p,c)=>p+c,0),mean=a=>sum(a)/a.length,
sd=a=>Math.sqrt(sum(a.map(z=>(z-mean(a))**2))/(a.length-1)),
f=n=>String(Number(n.toPrecision(S.sf)));
const CU="(concentration unit of the standards)";
const cal=sig=>v=>{const x=v.x,y=v.y,n=x.length;
 if(n!=y.length)throw Error(`${n} concentrations but ${y.length} ${sig} values`);
 if(n<3)throw Error("Use at least 3 standards");
 const xm=mean(x),ym=mean(y),sxx=sum(x.map(a=>(a-xm)**2));
 if(!sxx)throw Error("All concentrations are the same");
 const m=sum(x.map((a,i)=>(a-xm)*(y[i]-ym)))/sxx,b=ym-m*xm,
 ssr=sum(x.map((a,i)=>(y[i]-m*a-b)**2)),sst=sum(y.map(a=>(a-ym)**2)),sr=Math.sqrt(ssr/(n-2));
 if(!m)throw Error("Slope is zero, cannot calculate");
 const o=[`y = ${f(m)} x + ${f(b)}`,`R² = ${sst?f(1-ssr/sst):"n/a"}`,
 `LOD (3.3 s/slope) = ${f(3.3*sr/m)} ${CU}`,`LOQ (10 s/slope) = ${f(10*sr/m)} ${CU}`];
 v.s.forEach(s=>o.push(`${sig} ${f(s)} -> concentration = ${f((s-b)/m*v.df)} ${CU}`+
 (s<Math.min(...y)||s>Math.max(...y)?" (outside calibrated range)":"")));
 o.plot={x,y,m,b,s:v.s};return o};
const G={
"Solutions":[
["Molarity from mass",["mass|Mass of solute (g)","mm|Molar mass (g/mol)","v|Volume of solution (mL)"],
 v=>{const n=v.mass/v.mm;return[`Moles = ${f(n)} mol`,`Molarity = ${f(n/(v.v/1000))} M`]}],
["Molality from mass",["mass|Mass of solute (g)","mm|Molar mass (g/mol)","sv|Mass of solvent (g)"],
 v=>{const n=v.mass/v.mm;return[`Moles = ${f(n)} mol`,`Molality = ${f(n/(v.sv/1000))} mol/kg`]}],
["Mass to weigh for a required molarity",["M|Required molarity (M)","v|Required volume (mL)","mm|Molar mass (g/mol)","p|Purity of reagent (%)|100"],
 v=>[`Weigh ${f(v.M*v.v/1000*v.mm/(v.p/100))} g of reagent (${f(v.p)}% pure)`,`Dissolve and make up to ${f(v.v)} mL`]],
["Dilution (C1V1 = C2V2)",["c1|Stock concentration C1","c2|Required concentration C2 (same unit)","v2|Required final volume V2 (mL)"],
 v=>{if(v.c2>v.c1)throw Error("Required concentration is higher than the stock");const v1=v.c2*v.v2/v.c1;
 return[`Take ${f(v1)} mL of stock`,`Add ${f(v.v2-v1)} mL solvent (total ${f(v.v2)} mL)`]}],
["Serial dilution",["c0|Starting concentration","fac|Dilution factor per step (10 = 1:10)","n|Number of steps","vol|Final volume of each tube (mL)"],
 v=>{if(v.fac<=1)throw Error("Dilution factor must be greater than 1");if(v.n>50)throw Error("Maximum 50 steps");
 const t=v.vol/v.fac,o=[`Each step: ${f(t)} mL of previous solution + ${f(v.vol-t)} mL diluent`];let c=v.c0;
 for(let i=1;i<=v.n;i++){c/=v.fac;o.push(`Step ${i}: concentration = ${f(c)}`)}return o}],
["Standard series from a stock solution",["stock|Stock concentration","vol|Final volume of each flask (mL)","*c|Required concentrations (same unit as stock)"],
 v=>{let t=0;const o=v.c.map(c=>{if(c>v.stock)return`${f(c)}: higher than stock, cannot prepare`;
 const s=c*v.vol/v.stock;t+=s;return`${f(c)}: take ${f(s)} mL stock, make up to ${f(v.vol)} mL`});o.push(`Total stock needed = ${f(t)} mL`);return o}],
["Convert mol/L to ppm (mg/L)",["c|Concentration (mol/L)","mm|Molar mass (g/mol)"],v=>[`${f(v.c)} M = ${f(v.c*v.mm*1000)} ppm`]],
["Convert ppm (mg/L) to mol/L",["c|Concentration (ppm)","mm|Molar mass (g/mol)"],v=>[`${f(v.c)} ppm = ${f(v.c/(v.mm*1000))} mol/L`]]
],
"Titration":[
["Unknown concentration from titre",["a|a: coefficient of analyte|1","b|b: coefficient of titrant|1","mt|Titrant concentration (M)","vt|Titre volume (mL)","va|Volume of analyte titrated (mL)"],
 v=>{const nt=v.mt*v.vt/1000,na=nt*v.a/v.b;return[`Moles of titrant = ${f(nt)} mol`,`Moles of analyte = ${f(na)} mol`,`Analyte concentration = ${f(na/(v.va/1000))} M`]}],
["Mean titre, SD and RSD",["*t|Titre values (mL)"],
 v=>{if(v.t.length<2)throw Error("Enter at least 2 titre values");const m=mean(v.t),s=sd(v.t),r=Math.max(...v.t)-Math.min(...v.t);
 return[`Mean titre = ${f(m)} mL`,`Standard deviation = ${f(s)} mL`,`RSD = ${f(s/m*100)} %`,`Range = ${r.toFixed(2)} mL: ${r<=0.10001?"concordant (within 0.10 mL)":"NOT concordant, repeat the titration"}`]}],
["Assay / % purity of a sample",["a|a: coefficient of analyte|1","b|b: coefficient of titrant|1","mt|Titrant concentration (M)","vt|Titre volume (mL)","mm|Molar mass of analyte (g/mol)","w|Mass of sample (g)","df|Dilution factor (total volume / aliquot, 1 if none)|1"],
 v=>{const m=v.mt*v.vt/1000*v.a/v.b*v.mm*v.df;return[`Mass of analyte = ${f(m)} g`,`Content = ${f(m/v.w*100)} % w/w`]}],
["Normality",["m|Molarity (M)","n|n-factor (equivalents per mole)"],v=>[`Normality = ${f(v.m*v.n)} N`]]
],
"UV-Vis":[
["Beer-Lambert: find concentration",["-A|Absorbance (A)","e|Molar absorptivity (L/mol/cm)","b|Path length (cm)|1"],v=>[`Concentration = ${f(v.A/(v.e*v.b))} mol/L`]],
["Beer-Lambert: find absorbance",["e|Molar absorptivity (L/mol/cm)","c|Concentration (mol/L)","b|Path length (cm)|1"],v=>[`Absorbance = ${f(v.e*v.b*v.c)}`]],
["Beer-Lambert: find molar absorptivity",["-A|Absorbance (A)","c|Concentration (mol/L)","b|Path length (cm)|1"],v=>[`Molar absorptivity = ${f(v.A/(v.b*v.c))} L/(mol cm)`]],
["%T to absorbance",["T|Percent transmittance (%T)"],v=>{if(v.T>100)throw Error("%T cannot be more than 100");return[`Absorbance = ${f(2-Math.log10(v.T))}`]}],
["Absorbance to %T",["-A|Absorbance (A)"],v=>[`%T = ${f(100*10**(-v.A))} %`]],
["Calibration curve, LOD/LOQ and unknowns",["*x|Standard concentrations","*y|Absorbances of standards (same order)","*s|Sample absorbances (optional)|","df|Sample dilution factor|1"],cal("Absorbance")]
],
"GC / HPLC":[
["Calibration curve (peak area)",["*x|Standard concentrations","*y|Peak areas of standards (same order)","*s|Sample peak areas (optional)|","df|Sample dilution factor|1"],cal("Peak area")],
["Internal standard method",["cas|Analyte conc. in standard","cis|Internal std conc. in standard","aas|Analyte peak area in standard","ais|Internal std peak area in standard","cis2|Internal std conc. in sample","aa|Analyte peak area in sample","ais2|Internal std peak area in sample"],
 v=>{const rf=(v.aas/v.ais)/(v.cas/v.cis);return[`Response factor (RF) = ${f(rf)}`,`Analyte concentration in sample = ${f(v.aa/v.ais2/rf*v.cis2)} (same unit as standard)`]}],
["Area percent (normalization)",["*a|Peak areas"],v=>{const t=sum(v.a);return v.a.map((x,i)=>`Peak ${i+1}: ${f(x/t*100)} %`).concat(`Total area = ${f(t)}`)}],
["Retention factor (k)",["tr|Retention time tR (min)","t0|Dead time t0 (min)"],v=>{if(v.tr<=v.t0)throw Error("tR must be greater than t0");return[`k = ${f((v.tr-v.t0)/v.t0)}`]}],
["Selectivity and resolution",["t0|Dead time t0 (min)","t1|Retention time, peak 1 (min)","t2|Retention time, peak 2 (min)","w1|Base width, peak 1 (min)","w2|Base width, peak 2 (min)"],
 v=>{if(v.t1<=v.t0||v.t2<=v.t0)throw Error("Retention times must be greater than t0");
 const k1=(v.t1-v.t0)/v.t0,k2=(v.t2-v.t0)/v.t0,rs=2*Math.abs(v.t2-v.t1)/(v.w1+v.w2);
 return[`k1 = ${f(k1)}, k2 = ${f(k2)}`,`Selectivity (α) = ${f(Math.max(k1,k2)/Math.min(k1,k2))}`,`Resolution (Rs) = ${f(rs)}: ${rs>=1.5?"baseline resolved":"not fully resolved (Rs < 1.5)"}`]}],
["Plate number (base width)",["tr|Retention time tR","w|Peak base width (same unit)","L|Column length (mm, optional)|"],
 v=>{const n=16*(v.tr/v.w)**2,o=[`Theoretical plates N = ${f(n)}`];if(v.L)o.push(`Plate height = ${f(v.L/n)} mm`);return o}],
["Plate number (half-height width)",["tr|Retention time tR","w|Peak width at half height (same unit)","L|Column length (mm, optional)|"],
 v=>{const n=5.54*(v.tr/v.w)**2,o=[`Theoretical plates N = ${f(n)}`];if(v.L)o.push(`Plate height = ${f(v.L/n)} mm`);return o}],
["Tailing factor",["w|Peak width at 5% height, W0.05","fr|Leading edge to peak maximum at 5% height, f"],
 v=>{const t=v.w/(2*v.fr);return[`T = ${f(t)}: ${t<=2?"acceptable (usually ≤ 2.0)":"high tailing"}`]}]
],
"TLC":[
["Rf value",["front|Distance travelled by solvent front (cm)","*d|Distance travelled by each spot (cm)"],
 v=>v.d.map((d,i)=>d>v.front?`Spot ${i+1}: distance is larger than the solvent front, check values`:`Spot ${i+1}: Rf = ${f(d/v.front)}`)]
]};

function parse(s){const[k,label,def]=s.split("|");const fl=/^[*-]/.test(k)?k[0]:"";
 return{id:fl?k.slice(1):k,label,def,list:fl=="*",any:fl!=""}}
function card(c){
 const fs=c[1].map(parse),d=document.createElement("details"),
 h=fs.map(x=>`<label>${x.label}</label>`+(x.list?`<textarea data-id="${x.id}" placeholder="${x.def===undefined?"e.g. 1, 2, 3":"optional"}"></textarea>`
 :`<input data-id="${x.id}" inputmode="decimal" autocomplete="off" placeholder="${x.def===undefined?"":x.def===""?"optional":"default "+x.def}">`)).join("");
 d.innerHTML=`<summary>${c[0]}${c[3]?' <small style="color:var(--mu);font-weight:normal">(advanced)</small>':""}</summary><form>${h}<button class="go">Calculate</button><div class="out"></div></form>`;
 const out=d.querySelector(".out");
 d.querySelector("form").onsubmit=e=>{e.preventDefault();out.className="out";
  try{const v={};
   fs.forEach(x=>{const raw=d.querySelector(`[data-id="${x.id}"]`).value.trim();
    if(x.list){const a=raw?raw.split(/[\s,;]+/).filter(Boolean).map(Number):[];
     if(!a.length&&x.def===undefined)throw Error("Fill in: "+x.label);
     if(a.some(isNaN))throw Error("Only numbers are allowed in: "+x.label);v[x.id]=a;return}
    if(raw===""){if(x.def===undefined)throw Error("Fill in: "+x.label);v[x.id]=x.def===""?null:Number(x.def);return}
    const n=Number(raw);if(isNaN(n))throw Error("Please enter a number for: "+x.label);
    if(!x.any&&n<=0)throw Error("Must be greater than zero: "+x.label);v[x.id]=n});
   const r=c[2](v);if(r.some(z=>/NaN|Infinity/.test(z)))throw Error("Cannot calculate with these values");
   out.innerHTML=r.join("<br>")+(r.plot?plot(r.plot):"");logRes(c[0],r)}
  catch(err){out.className="out err";out.textContent=err.message}};
 return d}
const nav=document.getElementById("nav"),box=document.getElementById("box");
function show(g){[...nav.children].forEach(b=>b.classList.toggle("on",b.textContent==g));
 box.innerHTML="";if(g=="History")box.append(histView());else G[g].forEach(c=>box.append(card(c)))}

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function plot(p){const W=320,H=220,L=48,R=12,T=12,B=30,
 xs=p.x.concat(p.s.map(s=>(s-p.b)/p.m)),ys=p.y.concat(p.s),
 x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),
 px=a=>L+(a-x0)/((x1-x0)||1)*(W-L-R),py=a=>H-B-(a-y0)/((y1-y0)||1)*(H-T-B),
 pt=(a,b,c)=>`<circle cx="${px(a)}" cy="${py(b)}" r="4" fill="${c}"/>`,
 tx=(x,y,a,t)=>`<text x="${x}" y="${y}" font-size="10" text-anchor="${a}" fill="currentColor">${t}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;margin-top:8px">`+
 `<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="currentColor"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="currentColor"/>`+
 `<line x1="${px(x0)}" y1="${py(p.m*x0+p.b)}" x2="${px(x1)}" y2="${py(p.m*x1+p.b)}" stroke="#d9822b" stroke-width="2"/>`+
 p.x.map((a,i)=>pt(a,p.y[i],"#1f78c8")).join("")+p.s.map(s=>pt((s-p.b)/p.m,s,"#2e9e5b")).join("")+
 tx(L,H-14,"start",f(x0))+tx(W-R,H-14,"end",f(x1))+tx(L-4,H-B,"end",f(y0))+tx(L-4,T+8,"end",f(y1))+
 tx((L+W-R)/2,H-2,"middle","Concentration")+`</svg><div style="font-size:12px">Blue = standards, orange = fit line, green = samples</div>`}
const HK="chemLabHistory";
function getH(){try{return JSON.parse(localStorage.getItem(HK))||[]}catch(e){return[]}}
function setH(h){try{localStorage.setItem(HK,JSON.stringify(h))}catch(e){}}
function logRes(n,r){const h=getH();h.push({t:new Date().toLocaleString(),n,r:r.join("; ")});setH(h.slice(-500))}
const csvCell=s=>'"'+String(s).replace(/"/g,'""')+'"';
function histView(){const all=getH(),d=document.createElement("div");
 d.innerHTML=`<div class="hb"><button class="go" id="dl">Download CSV</button><button class="go" id="clr" style="background:#a33">Clear history</button></div>`+
 (all.length?all.slice().reverse().map(x=>`<div class="hi"><b>${esc(x.n)}</b> <small>${esc(x.t)}</small><br>${esc(x.r)}</div>`).join(""):`<p>No results saved yet. Results appear here after you press Calculate.</p>`);
 d.querySelector("#dl").onclick=()=>{if(!all.length)return alert("Nothing to download yet.");
  const rows=[["Time","Calculation","Result"]].concat(all.map(x=>[x.t,x.n,x.r])),
  blob=new Blob(["\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")],{type:"text/csv"}),
  a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lab_results_history.csv";a.click()};
 d.querySelector("#clr").onclick=()=>{if(confirm("Delete all saved results?")){setH([]);go("History")}};
 return d}

const R=8.314462618,FA=96485.33212,NAV=6.02214076e23,
T95=[12.706,4.303,3.182,2.776,2.571,2.447,2.365,2.306,2.262,2.228,2.201,2.179,2.160,2.145,2.131,2.120,2.110,2.101,2.093,2.086,2.080,2.074,2.069,2.064,2.060,2.056,2.052,2.048,2.045,2.042];
G["Titration"].push(
["Water content by Karl Fischer",["v|Titrant volume consumed (mL)","tf|Titre factor F (mg water per mL)","w|Sample mass (mg)"],v=>[`Water content = ${f(v.v*v.tf/v.w*100)} % w/w`]],
["Back titration",["c1|Concentration of excess reagent added (M)","v1|Volume of reagent added (mL)","c2|Concentration of back-titrant (M)","v2|Volume of back-titrant used (mL)","r|Moles reagent per mole back-titrant|1","s|Moles reagent per mole analyte|1","mm|Molar mass of analyte (g/mol)"],
 v=>{const u=v.c1*v.v1-v.c2*v.v2*v.r;if(u<0)throw Error("Back-titrant used is more than the reagent added, check values");const n=u/v.s/1000;return[`Moles of analyte = ${f(n)} mol`,`Mass of analyte = ${f(n*v.mm)} g`]}],
["Water hardness by EDTA titration",["c|EDTA concentration (M)","v|EDTA volume (mL)","vs|Sample volume (mL)"],v=>[`Hardness = ${f(v.c*v.v*100.0869*1000/v.vs)} mg/L as CaCO3`]]);
G["UV-Vis"].push(
["Standard addition method",["*x|Added concentrations (0 for the unspiked sample)","*y|Measured signals (same order)"],
 v=>{const x=v.x,y=v.y,n=x.length;if(n!=y.length||n<3)throw Error("Enter at least 3 matching x and y values");
 const xm=mean(x),ym=mean(y),sxx=sum(x.map(a=>(a-xm)**2)),m=sum(x.map((a,i)=>(a-xm)*(y[i]-ym)))/sxx,b=ym-m*xm,
 ssr=sum(x.map((a,i)=>(y[i]-m*a-b)**2)),sst=sum(y.map(a=>(a-ym)**2));if(!m)throw Error("Slope is zero");
 return[`y = ${f(m)} x + ${f(b)}`,`R² = ${sst?f(1-ssr/sst):"n/a"}`,`Unknown concentration = ${f(Math.abs(b/m))} (same unit as the added standard)`]}],

["Content uniformity: acceptance value (reference formula)",["*x|Unit contents (% of label claim)","m|Reference value M (%) from current USP","k|Constant k from current USP"],
 v=>{if(v.x.length<2)throw Error("Enter at least 2 units");const m=mean(v.x),s=sd(v.x);return[`Mean = ${f(m)} %, SD = ${f(s)}`,`AV = |M - mean| + k s = ${f(Math.abs(v.m-m)+v.k*s)}`,"Take M, k, L1 and the stage rules from the current USP <905>."]}],
["Dissolution with aliquot replacement",["ct|Concentration at time t (mg/mL)","v|Vessel volume (mL)","vs|Aliquot volume withdrawn (mL)","*pr|Concentrations of earlier aliquots (optional)|","lc|Label claim (mg)"],
 v=>{const mt=v.ct*v.v+v.vs*sum(v.pr);return[`Cumulative amount = ${f(mt)} mg`,`Dissolved = ${f(mt/v.lc*100)} %`]}]);
G["General and Physical"].push(["Moles of gas (n = PV/RT)",["p|Pressure (atm)","vol|Volume (L)","T|Temperature (K)"],v=>[`n = ${f(v.p*v.vol/(0.082057366*v.T))} mol`]]);
["Solutions","Concentration and Stoichiometry","Titration","Acid-Base and Equilibrium","UV-Vis","GC / HPLC","TLC","Pharma and Gravimetry","Statistics","Electrochemistry","Kinetics and Stability","General and Physical"].forEach(k=>{const t=G[k];delete G[k];G[k]=t});

Object.values(G).forEach(a=>a.forEach(c=>{if(ADV.includes(c[0]))c[3]=1}));
const IC={"Solutions":"🧪","Titration":"⚗️","UV-Vis":"🌈","GC / HPLC":"📈","TLC":"🧫","Statistics":"📊","Pharma and Gravimetry":"💊","Acid-Base and Equilibrium":"🧮","Electrochemistry":"⚡","General and Physical":"⚖️","Concentration and Stoichiometry":"🔢","Kinetics and Stability":"⏱️"};

const E=[0].concat("Hydrogen,H,1.008;Helium,He,4.0026;Lithium,Li,6.94;Beryllium,Be,9.0122;Boron,B,10.81;Carbon,C,12.011;Nitrogen,N,14.007;Oxygen,O,15.999;Fluorine,F,18.998;Neon,Ne,20.180;Sodium,Na,22.990;Magnesium,Mg,24.305;Aluminium,Al,26.982;Silicon,Si,28.085;Phosphorus,P,30.974;Sulfur,S,32.06;Chlorine,Cl,35.45;Argon,Ar,39.948;Potassium,K,39.098;Calcium,Ca,40.078;Scandium,Sc,44.956;Titanium,Ti,47.867;Vanadium,V,50.942;Chromium,Cr,51.996;Manganese,Mn,54.938;Iron,Fe,55.845;Cobalt,Co,58.933;Nickel,Ni,58.693;Copper,Cu,63.546;Zinc,Zn,65.38;Gallium,Ga,69.723;Germanium,Ge,72.630;Arsenic,As,74.922;Selenium,Se,78.971;Bromine,Br,79.904;Krypton,Kr,83.798;Rubidium,Rb,85.468;Strontium,Sr,87.62;Yttrium,Y,88.906;Zirconium,Zr,91.224;Niobium,Nb,92.906;Molybdenum,Mo,95.95;Technetium,Tc,98;Ruthenium,Ru,101.07;Rhodium,Rh,102.91;Palladium,Pd,106.42;Silver,Ag,107.87;Cadmium,Cd,112.41;Indium,In,114.82;Tin,Sn,118.71;Antimony,Sb,121.76;Tellurium,Te,127.60;Iodine,I,126.90;Xenon,Xe,131.29;Caesium,Cs,132.91;Barium,Ba,137.33;Lanthanum,La,138.91;Cerium,Ce,140.12;Praseodymium,Pr,140.91;Neodymium,Nd,144.24;Promethium,Pm,145;Samarium,Sm,150.36;Europium,Eu,151.96;Gadolinium,Gd,157.25;Terbium,Tb,158.93;Dysprosium,Dy,162.50;Holmium,Ho,164.93;Erbium,Er,167.26;Thulium,Tm,168.93;Ytterbium,Yb,173.05;Lutetium,Lu,174.97;Hafnium,Hf,178.49;Tantalum,Ta,180.95;Tungsten,W,183.84;Rhenium,Re,186.21;Osmium,Os,190.23;Iridium,Ir,192.22;Platinum,Pt,195.08;Gold,Au,196.97;Mercury,Hg,200.59;Thallium,Tl,204.38;Lead,Pb,207.2;Bismuth,Bi,208.98;Polonium,Po,209;Astatine,At,210;Radon,Rn,222;Francium,Fr,223;Radium,Ra,226;Actinium,Ac,227;Thorium,Th,232.04;Protactinium,Pa,231.04;Uranium,U,238.03;Neptunium,Np,237;Plutonium,Pu,244;Americium,Am,243;Curium,Cm,247;Berkelium,Bk,247;Californium,Cf,251;Einsteinium,Es,252;Fermium,Fm,257;Mendelevium,Md,258;Nobelium,No,259;Lawrencium,Lr,266;Rutherfordium,Rf,267;Dubnium,Db,268;Seaborgium,Sg,269;Bohrium,Bh,270;Hassium,Hs,277;Meitnerium,Mt,278;Darmstadtium,Ds,281;Roentgenium,Rg,282;Copernicium,Cn,285;Nihonium,Nh,286;Flerovium,Fl,289;Moscovium,Mc,290;Livermorium,Lv,293;Tennessine,Ts,294;Oganesson,Og,294".split(";").map(x=>x.split(",")));
const ORD="1s2s2p3s3p4s3d4p5s4d5p6s4f5d6p7s5f6d7p".match(/\d[spdf]/g),CAP={s:2,p:6,d:10,f:14},
EX={24:"3d5 4s1",29:"3d10 4s1",41:"4d4 5s1",42:"4d5 5s1",44:"4d7 5s1",45:"4d8 5s1",46:"4d10",47:"4d10 5s1",57:"5d1 6s2",58:"4f1 5d1 6s2",64:"4f7 5d1 6s2",78:"4f14 5d9 6s1",79:"4f14 5d10 6s1",89:"6d1 7s2",90:"6d2 7s2",91:"5f2 6d1 7s2",92:"5f3 6d1 7s2",93:"5f4 6d1 7s2",96:"5f7 6d1 7s2",103:"5f14 7s2 7p1"},
CT=["Alkali metal","Alkaline earth metal","Transition metal","Post-transition metal","Metalloid","Nonmetal","Halogen","Noble gas","Lanthanide","Actinide"],
NG=[2,10,18,36,54,86,118],HAL=[9,17,35,53,85,117],MET=[5,14,32,33,51,52],NM=[1,6,7,8,15,16,34],PT=[13,31,49,50,81,82,83,84,113,114,115,116];
function fill(z){let r=z;const o=[];for(const s of ORD){if(r<=0)break;const n=Math.min(r,CAP[s[1]]);o.push([s,n]);r-=n}return o}
function config(z){const c=[[86,"Rn"],[54,"Xe"],[36,"Kr"],[18,"Ar"],[10,"Ne"],[2,"He"]].find(k=>k[0]<z);
 if(!c)return fill(z).map(x=>x.join("")).join(" ");const core=fill(c[0]).map(x=>x[0]);
 return`[${c[1]}] `+(EX[z]||fill(z).filter(x=>!core.includes(x[0])).map(x=>x.join("")).join(" "))}
function pos(z){if(z==1)return[1,1];if(z==2)return[1,18];if(z<=4)return[2,z-2];if(z<=10)return[2,z+8];if(z<=12)return[3,z-10];if(z<=18)return[3,z];
 if(z<=36)return[4,z-18];if(z<=54)return[5,z-36];if(z<=56)return[6,z-54];if(z<=71)return[8,z-54];if(z<=86)return[6,z-68];if(z<=88)return[7,z-86];if(z<=103)return[9,z-86];return[7,z-100]}
const fz=z=>z>=57&&z<=71||z>=89&&z<=103,per=z=>z<=2?1:z<=10?2:z<=18?3:z<=36?4:z<=54?5:z<=86?6:7,grp=z=>fz(z)?0:pos(z)[1],
blk=z=>fz(z)?"f":z==2?"s":pos(z)[1]<=2?"s":pos(z)[1]>=13?"p":"d";
function cat(z){if(NG.includes(z))return"Noble gas";if(HAL.includes(z))return"Halogen";if(z>=57&&z<=71)return"Lanthanide";if(z>=89&&z<=103)return"Actinide";
 if(MET.includes(z))return"Metalloid";if(NM.includes(z))return"Nonmetal";if(PT.includes(z))return"Post-transition metal";const c=pos(z)[1];return c==1?"Alkali metal":c==2?"Alkaline earth metal":"Transition metal"}

function ptable(){const d=document.createElement("div");
 d.innerHTML=`<div class="bar"><button class="bk">‹ Home</button><h2>Periodic Table</h2></div><input class="sr" placeholder="Search name, symbol or atomic number...">
 <select class="sr"></select><div class="det">Tap an element to see its details.</div><div class="ptw"><div class="pt"></div></div>`;
 const sr=d.querySelector("input"),pf=d.querySelector("select"),det=d.querySelector(".det"),pt=d.querySelector(".pt"),T=[];
 [["","Highlight: all elements"]].concat(CT.map(c=>["c:"+c,c]),["s","p","d","f"].map(b=>["b:"+b,b+"-block"]),[1,2,3,4,5,6,7].map(p=>["p:"+p,"Period "+p]),
 Array.from({length:18},(_,i)=>["g:"+(i+1),"Group "+(i+1)])).forEach(o=>pf.append(new Option(o[1],o[0])));
 const info=z=>{const e=E[z],rad=z==43||z==61||z>=84&&![90,91,92].includes(z);
  det.innerHTML=`<h3>${e[0]} (${e[1]})</h3><table>`+[["Atomic number",z],["Atomic mass (u)",e[2]],["Mass number (nearest)",Math.round(e[2])+(rad?" (longest-lived isotope)":"")],
  ["Electron configuration",config(z)],["Group",grp(z)||"— (f-block)"],["Period",per(z)],["Block",blk(z)+"-block"],["Category",cat(z)]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")+"</table>"};
 for(let z=1;z<=118;z++){const[r,c]=pos(z),t=document.createElement("div");t.className="el";
  t.style.cssText=`grid-row:${fz(z)?r+1:r};grid-column:${c};background:hsl(${CT.indexOf(cat(z))*36} 60% 76%)`;
  t.innerHTML=`<small>${z}</small><b>${E[z][1]}</b>`;t.onclick=()=>info(z);pt.append(t);T[z]=t}
 [[6,"57-71"],[7,"89-103"]].forEach(a=>{const t=document.createElement("div");t.className="el ph";t.style.cssText=`grid-row:${a[0]};grid-column:3`;t.textContent=a[1];pt.append(t)});
 const upd=()=>{const q=sr.value.trim().toLowerCase(),[k,vv]=(pf.value||":").split(":"),hit=[];
  for(let z=1;z<=118;z++){const e=E[z],a=!q||e[0].toLowerCase().includes(q)||e[1].toLowerCase()==q||String(z)==q,
   b=!k||(k=="c"?cat(z)==vv:k=="b"?blk(z)==vv:k=="p"?per(z)==+vv:grp(z)==+vv);T[z].style.opacity=a&&b?1:.15;if(q&&a)hit.push(z)}
  if(hit.length==1)info(hit[0])};
 sr.oninput=upd;pf.onchange=upd;d.querySelector(".bk").onclick=()=>go("Home");box.append(d)}

function home(){const d=document.createElement("div");
 d.innerHTML=`<input class="sr" placeholder="Search every formula: molarity, Nernst, LOD, recovery..."><div class="grid"></div><div id="res"></div>`;
 const gr=d.querySelector(".grid"),res=d.querySelector("#res"),gs=d.querySelector("input");
 const tile=(i,t,s,fn)=>{const b=document.createElement("button");b.className="tile";b.innerHTML=`<span>${i}</span><b>${t}</b><small>${s}</small>`;b.onclick=fn;gr.append(b)};
 Object.keys(G).forEach(g=>tile(IC[g]||"🧪",g,G[g].length+" calculators",()=>go(g)));
 tile("⚛️","Periodic Table","118 elements",()=>go("Periodic"));
 gs.oninput=()=>{const q=gs.value.trim().toLowerCase();res.innerHTML="";gr.style.display=q?"none":"";if(!q)return;
  Object.keys(G).forEach(g=>G[g].forEach(c=>{if((c[0]+" "+g).toLowerCase().includes(q))res.append(card(c))}));if(!res.children.length)res.textContent="No formula found."};
 box.append(d)}

function section(g){const d=document.createElement("div"),l=document.createElement("div");
 d.innerHTML=`<div class="bar"><button class="bk">‹ Home</button><h2>${g}</h2></div><input class="sr" placeholder="Search in ${g}...">`;
 G[g].slice().sort((a,b)=>(a[3]||0)-(b[3]||0)).forEach(c=>l.append(card(c)));d.append(l);d.querySelector(".bk").onclick=()=>go("Home");
 d.querySelector("input").oninput=e=>{const q=e.target.value.toLowerCase();[...l.children].forEach(x=>x.style.display=x.firstChild.textContent.toLowerCase().includes(q)?"":"none")};box.append(d)}

function settings(){const d=document.createElement("div");
 d.innerHTML=`<div class="bar"><button class="bk">‹ Home</button><h2>Settings</h2></div>
 <label>Theme</label><select class="sr" id="th"><option value="auto">Automatic</option><option value="light">Light</option><option value="dark">Dark</option></select>
 <label>Significant figures in results</label><select class="sr" id="sf">${[3,4,5,6,7,8].map(n=>`<option>${n}</option>`).join("")}</select>
 <label>Saved results</label><button class="go" id="cl" style="background:#a33">Clear history</button>
 <p style="color:var(--mu);font-size:13px">Chemistry Lab Calculator v2. Works offline. Your data stays on this device.</p>`;
 const th=d.querySelector("#th"),sf=d.querySelector("#sf");th.value=S.th;sf.value=S.sf;
 th.onchange=()=>{S.th=th.value;saveS();applyTh()};sf.onchange=()=>{S.sf=+sf.value;saveS()};
 d.querySelector("#cl").onclick=()=>{if(confirm("Delete all saved results?"))setH([])};
 d.querySelector(".bk").onclick=()=>go("Home");box.append(d)}

function go(v){[...nav.children].forEach(b=>b.classList.toggle("on",b.dataset.v==v||(v in G&&b.dataset.v=="Home")));box.innerHTML="";window.scrollTo(0,0);
 if(v=="Home")home();else if(v=="Periodic")ptable();else if(v=="History")box.append(histView());else if(v=="Settings")settings();else section(v)}
[["Home","🏠"],["Periodic","⚛️"],["History","🕘"],["Settings","⚙️"]].forEach(a=>{const b=document.createElement("button");b.dataset.v=a[0];b.innerHTML=a[1]+"<br>"+a[0];b.onclick=()=>go(a[0]);nav.append(b)});
go("Home");
